spring:

  jackson:
    time-zone: Asia/Seoul

  application:
    name: voice

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:voice-coaching}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:600}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_OAUTH_CLIENT_ID:}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}


