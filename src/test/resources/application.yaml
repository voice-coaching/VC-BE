spring:
  datasource:
    url: jdbc:h2:mem:voice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

auth:
  jwt:
    secret: test-secret-test-secret-test-secret-1234
    issuer: voice-test
    access-token-seconds: 600
    refresh-token-seconds: 1200
  cookie:
    secure: false
    same-site: Lax
  oauth:
    google:
      client-id: test
      client-secret: test
    kakao:
      client-id: test
      client-secret: test
