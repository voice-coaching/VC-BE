# Include inside the api.voice-coaching.site server, before any regex locations.
# Location matching includes only externally initiated analysis work.
location ~ ^/api/(training-sessions/[0-9]+/(analyze|analysis/retry)|analyses/[0-9]+/feedback/regenerate)$ {
    default_type application/json;
    if (-f /var/lib/alpha-deploy/analysis-admission.closed) {
        add_header Retry-After 15 always;
        add_header Cache-Control no-store always;
        return 503 '{"result":false,"message":"분석 서버를 준비 중입니다. 잠시 후 다시 시도해 주세요.","data":null,"code":"ANALYSIS_MAINTENANCE"}';
    }
    proxy_pass http://127.0.0.1:8080;
    proxy_next_upstream off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
