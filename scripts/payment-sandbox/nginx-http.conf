# HTTP-context include. Only the dedicated /payment-test/ location uses these maps/zones.
map_hash_bucket_size 128;
map "$request_method:$uri" $alpha_payment_test_route_allowed {
    default 0;
    "POST:/payment-test/api/auth/login" 1;
    "POST:/payment-test/api/auth/token/refresh" 1;
    "POST:/payment-test/api/auth/logout" 1;
    "GET:/payment-test/api/users/me" 1;
    "GET:/payment-test/api/users/me/payment-orders" 1;
    "POST:/payment-test/api/payment-orders" 1;
    "~^GET:/payment-test/api/payment-orders/test[a-f0-9]{32}$" 1;
    "~^POST:/payment-test/api/payment-orders/test[a-f0-9]{32}/verify$" 1;
    "~^POST:/payment-test/api/payment-orders/test[a-f0-9]{32}/cancel$" 1;
    "~^POST:/payment-test/api/payment-orders/test[a-f0-9]{32}/refund-requests$" 1;
    "~^GET:/payment-test/api/refund-requests/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$" 1;
    "POST:/payment-test/api/payments/webhooks/portone" 1;
    "GET:/payment-test/v3/api-docs" 1;
    "GET:/payment-test/v3/api-docs/swagger-config" 1;
    "~^GET:/payment-test/swagger-ui/[A-Za-z0-9._/-]+$" 1;
    "~^OPTIONS:/payment-test/api/(auth/(login|token/refresh|logout)|users/me(/payment-orders)?|payment-orders(/test[a-f0-9]{32}(/(verify|cancel|refund-requests))?)?|refund-requests/[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}|payments/webhooks/portone)$" 1;
}
map $uri $alpha_payment_test_login_key {
    default "";
    /payment-test/api/auth/login $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=alpha_payment_test:1m rate=2r/s;
limit_req_zone $alpha_payment_test_login_key zone=alpha_payment_test_login:1m rate=10r/m;
