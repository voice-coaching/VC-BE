# Include in the existing api.voice-coaching.site HTTPS server only.
location = /payment-test { return 308 /payment-test/; }
location = /payment-test/ { return 302 /payment-test/swagger-ui/index.html; }
location ^~ /payment-test/ {
    if ($alpha_payment_test_route_allowed = 0) { return 404; }
    limit_req zone=alpha_payment_test burst=30 nodelay;
    limit_req zone=alpha_payment_test_login burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    rewrite ^/payment-test/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /payment-test;
    proxy_cookie_path /api/auth /payment-test/api/auth;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
}
