name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify JAR retention and deployment integration
        run: python -m unittest discover -s scripts/deployment -p 'test_*retention*.py'
      - name: Compile production and existing test sources; package without QA execution
        run: bash gradlew clean compileJava compileTestJava bootJar -x test --no-daemon
