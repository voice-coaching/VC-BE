name: Deploy production

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false
  # Keep both branches' pending releases; Git policy rejects superseded code.
  queue: max

jobs:
  deploy:
    if: github.ref_type == 'branch' && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment ref
        run: >-
          python3 -B scripts/deployment/branch_policy.py
          --ref-type "$GITHUB_REF_TYPE" --branch "$GITHUB_REF_NAME"
          --candidate "$GITHUB_SHA" --ref-only

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/deploy.sh

      - name: Set up Python 3.12 for deployment and sandbox verification
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate deployment branch and release policy
        run: python -B -m unittest discover -s scripts/deployment -p 'test_*.py'

      - name: Test and package exact release commit
        env:
          VC_BE_TEST_SANDBOX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./gradlew clean test bootJar --no-daemon

      - name: Validate isolated payment sandbox settings
        run: python -B -m unittest discover -s scripts/payment-sandbox -p test_settings.py

      - name: Select executable JAR
        id: artifact
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "$jar_path"
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$jar_path" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/alpha-deploy
          chmod 600 ~/.ssh/alpha-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        id: upload
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          JAR_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          scp -i ~/.ssh/alpha-deploy "$JAR_PATH" "$EC2_USER@$EC2_HOST:/var/tmp/alpha-${GITHUB_SHA}.jar"
          ssh -i ~/.ssh/alpha-deploy "$EC2_USER@$EC2_HOST" "mkdir -p '/var/tmp/alpha-deploy-${GITHUB_SHA}'"
          scp -i ~/.ssh/alpha-deploy scripts/deploy.sh "$EC2_USER@$EC2_HOST:/var/tmp/alpha-deploy-${GITHUB_SHA}/deploy.sh"
          scp -r -i ~/.ssh/alpha-deploy scripts/deployment "$EC2_USER@$EC2_HOST:/var/tmp/alpha-deploy-${GITHUB_SHA}/deployment"

      - name: Read committed live release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/alpha-deploy "$EC2_USER@$EC2_HOST" \
            "sudo python3 -B '/var/tmp/alpha-deploy-${GITHUB_SHA}/deployment/release_snapshot.py'" \
            > "$RUNNER_TEMP/alpha-live-release.json"

      - name: Check latest branch commit and live code ancestry
        id: policy
        run: |
          git fetch --no-tags origin \
            '+refs/heads/develop:refs/remotes/origin/develop' \
            '+refs/heads/main:refs/remotes/origin/main'
          python3 -B scripts/deployment/branch_policy.py \
            --ref-type "$GITHUB_REF_TYPE" --branch "$GITHUB_REF_NAME" \
            --candidate "$GITHUB_SHA" --snapshot "$RUNNER_TEMP/alpha-live-release.json" \
            >> "$GITHUB_OUTPUT"

      - name: Activate release
        if: steps.policy.outputs.deploy == 'true'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          JAR_SHA: ${{ steps.artifact.outputs.sha256 }}
          EXPECTED_RELEASE: ${{ steps.policy.outputs.expected_release }}
          EXPECTED_JAR: ${{ steps.policy.outputs.expected_jar }}
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$JAR_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RELEASE" =~ ^[0-9a-f]{40}$ && "$EXPECTED_JAR" =~ ^[0-9a-f]{64}$ ]]
          ssh -i ~/.ssh/alpha-deploy "$EC2_USER@$EC2_HOST" \
            "sudo bash '/var/tmp/alpha-deploy-${GITHUB_SHA}/deploy.sh' '$GITHUB_SHA' '$JAR_SHA' '$EXPECTED_RELEASE' '$EXPECTED_JAR'"

      - name: Remove this run's upload copies
        if: always() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure')
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i ~/.ssh/alpha-deploy "$EC2_USER@$EC2_HOST" \
            "rm -f -- '/var/tmp/alpha-${GITHUB_SHA}.jar'; rm -rf -- '/var/tmp/alpha-deploy-${GITHUB_SHA}'"
